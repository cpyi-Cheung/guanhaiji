<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>觀海記 · 礁石與沙灘</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1b4a63 0%, #0d2233 55%, #061420 100%);
    color: #e8f4ff;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 14px 10px 28px;
    -webkit-text-size-adjust: 100%;
  }

  .game {
    position: relative;
    width: 100%;
    max-width: 900px;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
    border: 1px solid rgba(140,200,240,.18);
    border-radius: 22px;
    padding: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  }

  .title {
    margin: 2px 0 12px;
    text-align: center;
    font-size: clamp(15px, 2.5vw, 21px);
    letter-spacing: 3px;
    font-weight: 800;
    color: #bfe6ff;
    text-shadow: 0 0 18px rgba(90,190,255,.55);
  }

  /* ---------- 頂部數值條 ---------- */
  .hud { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .bar-row {
    display: flex; align-items: center; gap: 8px;
    font-size: clamp(11px, 1.6vw, 14px);
  }
  .bar-row .label { width: 4.4em; text-align: right; flex: none; color: #cfe8f8; letter-spacing: 1px; }
  .bar {
    flex: 1; height: 15px;
    background: rgba(0,0,0,.38);
    border-radius: 999px; overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(0,0,0,.6);
  }
  .fill {
    height: 100%; width: 50%;
    border-radius: 999px;
    transition: width .75s cubic-bezier(.2,.85,.3,1);
  }
  .fill.p { background: linear-gradient(90deg, #ff7a7a, #c92a2a); box-shadow: 0 0 12px rgba(255,90,90,.75); }
  .fill.r { background: linear-gradient(90deg, #63b8f8, #1864ab); box-shadow: 0 0 12px rgba(90,170,255,.75); }
  .bar-row .val { width: 2.6em; flex: none; font-variant-numeric: tabular-nums; font-weight: 700; }

  /* ---------- 場景 ---------- */
  .scene {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: 235px;
    max-height: 420px;
    border-radius: 16px;
    overflow: hidden;
    background: #9fd8f5;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: inset 0 0 50px rgba(0,20,40,.22), 0 8px 22px rgba(0,0,0,.32);
  }

  /* 動態天氣：透過 .sky / .sea 的 class 切換 */
  .sky {
    position: absolute; inset: 0 0 45% 0;
    background: linear-gradient(180deg, #4fb3e8 0%, #8fd4f5 55%, #d8f1fd 100%);
    transition: background 1s ease;
  }
  /* 原則高：天空變暗 */
  .scene.mood-rock .sky {
    background: linear-gradient(180deg, #2a4a63 0%, #4a6d85 55%, #8fa5b5 100%);
  }
  /* 關係高：天空變暖 */
  .scene.mood-sand .sky {
    background: linear-gradient(180deg, #f8a850 0%, #ffd18a 55%, #fff0d0 100%);
  }

  .sun {
    position: absolute; top: 7%; right: 12%;
    width: clamp(26px, 5vw, 52px); aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #fffbd6 0%, #ffe066 45%, rgba(255,214,64,0) 72%);
    box-shadow: 0 0 40px rgba(255,224,102,.8);
    animation: sunPulse 4s ease-in-out infinite;
    opacity: .85;
    transition: opacity 1s ease, box-shadow 1s ease;
  }
  .scene.mood-sand .sun {
    opacity: 1;
    box-shadow: 0 0 80px 20px rgba(255,200,80,.9);
  }
  .scene.mood-rock .sun { opacity: 0.25; }
  @keyframes sunPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.08); }
  }

  .cloud {
    position: absolute; height: 4.5%;
    background: #fff; border-radius: 999px;
    opacity: .88; filter: blur(1px);
    box-shadow: 0 0 18px rgba(255,255,255,.6);
    transition: opacity 1s ease;
  }
  .cloud::before {
    content: ''; position: absolute;
    left: 18%; bottom: 45%; width: 36%; aspect-ratio: 1;
    background: inherit; border-radius: 50%;
  }
  .c1 { top: 11%; left: 7%;  width: 15%; animation: drift 26s ease-in-out infinite; }
  .c2 { top: 23%; left: 40%; width: 11%; animation: drift 34s ease-in-out infinite; }
  .c3 { top: 7%;  left: 64%; width: 13%; animation: drift 30s ease-in-out infinite; }
  .scene.mood-rock .cloud { opacity: .35; }
  .scene.mood-sand .cloud { opacity: 1; }
  @keyframes drift {
    0%,100% { transform: translateX(-8%); }
    50%     { transform: translateX(8%); }
  }

  /* 雨滴：只在 mood-rock 顯示 */
  .rain {
    position: absolute; inset: 0 0 45% 0;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
    z-index: 2;
  }
  .scene.mood-rock .rain { opacity: 1; }
  .rain::before, .rain::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(105deg, transparent 0 46%, rgba(200,230,255,.55) 46% 48%, transparent 48% 100%);
    background-size: 90px 90px;
    background-position: 0 0;
    animation: rainFall 0.6s linear infinite;
  }
  .rain::after {
    background-size: 130px 130px;
    background-position: 40px 30px;
    animation-duration: 0.9s;
    opacity: .7;
  }
  @keyframes rainFall {
    from { background-position: 0 -90px; }
    to   { background-position: 0 90px; }
  }

  .sea {
    position: absolute; left: 0; right: 0; top: 55%; bottom: 26%;
    background: linear-gradient(180deg, #46a9dd 0%, #1f74ab 55%, #14568a 100%);
    transition: background 1s ease;
  }
  .scene.mood-rock .sea {
    background: linear-gradient(180deg, #2c5d7d 0%, #1a3f5c 55%, #0d2739 100%);
  }
  .scene.mood-sand .sea {
    background: linear-gradient(180deg, #6cb9d8 0%, #3f8db5 55%, #276e94 100%);
  }
  .sea::before {
    content: '';
    position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0));
  }
  .sea::after {
    content: '';
    position: absolute; inset: 12% 0 auto 0; height: 40%;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.16) 0 2px, transparent 2px 16px);
    animation: waveShift 7s linear infinite;
  }
  @keyframes waveShift {
    from { background-position-y: 0; }
    to   { background-position-y: 16px; }
  }

  .sand {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
    background: linear-gradient(180deg, #f6e5b5 0%, #e8d099 55%, #d8b97a 100%);
    transition: filter 1s ease;
  }
  .scene.mood-rock .sand { filter: brightness(.75) saturate(.7); }
  .scene.mood-sand .sand { filter: brightness(1.08) saturate(1.15); }
  .sand::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(170,140,85,.35) 1px, transparent 1.6px);
    background-size: 16px 12px; opacity: .65;
  }

  .path {
    position: absolute; left: -3%; right: -3%; bottom: 19.5%; height: 8%;
    background: linear-gradient(180deg, #fbeec6, #e6d09b);
    border-radius: 999px; opacity: .95;
    box-shadow: 0 3px 0 rgba(150,120,70,.28), inset 0 1px 0 rgba(255,255,255,.6);
    z-index: 3;
  }

  /* ---------- 燈塔 ---------- */
  .lighthouse {
    position: absolute; left: 92%; bottom: 25%;
    width: clamp(16px, 2.6vw, 32px); aspect-ratio: 1 / 3;
    transform: translateX(-50%); z-index: 4;
  }
  .lighthouse .tower {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, #ffffff 0 20%, #e74c3c 20% 40%);
    clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
    border-radius: 4px 4px 2px 2px;
    box-shadow: inset -3px 0 6px rgba(0,0,0,.18);
  }
  .lighthouse .lamp {
    position: absolute; left: 50%; top: -22%;
    transform: translateX(-50%);
    width: 62%; aspect-ratio: 1 / 1.1;
    background: radial-gradient(circle at 50% 40%, #fffbe0, #ffd93d 55%, #f0a500);
    border-radius: 22% 22% 12% 12%;
    box-shadow: 0 0 20px 7px rgba(255,222,89,.7);
    animation: lampGlow 2.4s ease-in-out infinite;
  }
  .lighthouse .roof {
    position: absolute; left: 50%; top: -40%;
    transform: translateX(-50%);
    width: 80%; aspect-ratio: 2 / 1;
    background: #2c3e50;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  @keyframes lampGlow { 0%,100% { opacity: .8; } 50% { opacity: 1; } }

  /* ---------- 礁石 ---------- */
  .rock {
    position: absolute; bottom: 24%;
    width: clamp(24px, 4.4vw, 52px);
    aspect-ratio: 1.35 / 1;
    transform: translateX(-50%);
    background: radial-gradient(circle at 32% 22%, #9c8d7e 0%, #6b5d50 45%, #483d34 100%);
    border-radius: 46% 54% 38% 42% / 62% 66% 34% 38%;
    box-shadow: inset -3px -4px 6px rgba(0,0,0,.35),
                inset  3px  3px 6px rgba(255,255,255,.15),
                0 5px 10px rgba(0,0,0,.3);
    transition: box-shadow .3s, filter .3s, opacity .4s;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .rock .num {
    font-size: clamp(8px, 1.2vw, 13px);
    font-weight: 800;
    color: rgba(255,255,255,.9);
    text-shadow: 0 1px 2px rgba(0,0,0,.65);
    margin-top: 8%;
  }
  .rock.active {
    box-shadow: 0 0 0 3px rgba(255,228,140,.9),
                0 0 24px 7px rgba(255,205,80,.65),
                inset -3px -4px 6px rgba(0,0,0,.35);
    filter: brightness(1.15);
  }
  .rock.done { opacity: .5; filter: saturate(.55); }

  /* ---------- 小人 ---------- */
  .person {
    position: absolute; bottom: 25%; left: 5%;
    width: clamp(18px, 2.8vw, 34px);
    transform: translateX(-50%);
    transition: left .95s cubic-bezier(.45,.05,.35,1), opacity .4s ease;
    opacity: 0; z-index: 8; pointer-events: none;
  }
  .person.show { opacity: 1; }

  .person-inner {
    display: flex; flex-direction: column; align-items: center;
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-7%); }
  }

  .person .head {
    position: relative;
    width: 58%; aspect-ratio: 1;
    background: #f8d3a5;
    border: 2px solid #c99a6a;
    border-radius: 50%;
  }
  .person .head::after {
    content: '';
    position: absolute;
    top: -20%; left: -7%;
    width: 114%; height: 56%;
    background: #3d2b1f;
    border-radius: 50% 50% 30% 30%;
  }
  .person .body {
    width: 78%; aspect-ratio: 1 / 1.05;
    margin-top: -5%;
    background: linear-gradient(180deg, #4da3f0, #2b6cb0);
    border-radius: 38% 38% 22% 22%;
  }
  .person .legs {
    display: flex; gap: 14%;
    width: 58%; margin-top: -3%;
  }
  .person .leg {
    flex: 1; aspect-ratio: 1 / 1.7;
    background: #2f4f7a;
    border-radius: 0 0 42% 42%;
  }

  /* 小人頭上的狀態圖示 */
  .person-badge {
    position: absolute;
    bottom: 100%; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(11px, 1.6vw, 16px);
    line-height: 1;
    padding: 3px 5px;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    opacity: 0;
    transition: opacity .4s ease, transform .4s ease;
    white-space: nowrap;
  }
  .person-badge.show { opacity: 1; }

  /* ---------- 漂浮數值動畫 ---------- */
  .float-layer {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 30;
    overflow: hidden;
  }
  .float-num {
    position: absolute;
    font-weight: 900;
    font-size: clamp(14px, 2vw, 20px);
    text-shadow: 0 2px 6px rgba(0,0,0,.6), 0 0 12px currentColor;
    animation: floatUp 1.6s ease-out forwards;
    white-space: nowrap;
  }
  .float-num.up { color: #4ade80; }
  .float-num.down { color: #f87171; }
  @keyframes floatUp {
    0%   { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
    20%  { transform: translate(-50%, -14px) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
  }

  /* ============================================================
     對話遮罩：fixed 覆蓋整個視窗
     ============================================================ */
  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 99999;
    background: rgba(5, 20, 34, .85);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s;
  }
  #overlay.show { opacity: 1; visibility: visible; }

  #modal {
    width: 100%;
    max-width: 720px;
    max-height: calc(100vh - 40px);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    background: linear-gradient(180deg, #ffffff 0%, #eaf4ff 100%);
    color: #16324a;
    border-radius: 22px;
    padding: 24px 24px;
    box-shadow: 0 25px 80px rgba(0,0,0,.75);
    font-size: clamp(15px, 1.9vw, 17px);
    line-height: 1.75;
  }
  #modal::-webkit-scrollbar { width: 10px; }
  #modal::-webkit-scrollbar-thumb { background: #b3d4e8; border-radius: 5px; }
  #modal::-webkit-scrollbar-track { background: transparent; }

  #modal h3 {
    margin: 0 0 12px;
    font-size: 1.25em;
    color: #0b5c8a;
    border-left: 5px solid #3aa0d8;
    padding-left: 12px;
    line-height: 1.45;
  }
  #modal p { margin: 0 0 12px; }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 16px;
  }

  .choice {
    flex-shrink: 0;
    min-height: 52px;
    font-family: inherit;
    font-size: 0.98em;
    font-weight: 700;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    color: #fff;
    line-height: 1.45;
    transition: transform .15s, filter .15s;
    width: 100%;
    word-break: break-word;
    white-space: normal;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .choice .sub {
    display: block;
    font-size: .85em;
    font-weight: 500;
    opacity: .92;
    margin-top: 3px;
  }
  .choice.rock { background: linear-gradient(135deg, #8a6f5c, #4a372b); }
  .choice.sand { background: linear-gradient(135deg, #f5c463, #e09420); color: #3a2500; }
  .choice:hover  { transform: translateY(-2px); filter: brightness(1.08); }
  .choice:active { transform: translateY(0) scale(.985); }

  /* 隱藏選項：發光脈動 */
  .choice.secret {
    background: linear-gradient(135deg, #6ee7b7, #10b981);
    color: #05372b;
    animation: secretGlow 1.8s ease-in-out infinite;
  }
  @keyframes secretGlow {
    0%,100% { box-shadow: 0 0 12px 2px rgba(110,231,183,.55); }
    50%     { box-shadow: 0 0 24px 6px rgba(110,231,183,.9); }
  }

  #resultText { font-weight: 700; color: #0b5c8a; }
  .delta { font-size: 1em; color: #48697f; margin-bottom: 16px; }
  .delta b { font-size: 1.15em; }
  .delta .up   { color: #1f9d55; }
  .delta .down { color: #d64545; }

  .btn {
    flex-shrink: 0;
    font-family: inherit;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 800;
    letter-spacing: 1px;
    transition: transform .15s, filter .15s;
  }
  .btn.primary {
    display: block;
    width: 100%;
    padding: 13px 20px;
    font-size: 1em;
    color: #fff;
    background: linear-gradient(135deg, #29b6c9, #0b7285);
    margin-top: 14px;
  }
  .btn.primary:hover:not(:disabled)  { transform: translateY(-2px); filter: brightness(1.08); }
  .btn.primary:active:not(:disabled) { transform: translateY(0) scale(.985); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* 結局反思按鈕 */
  .reflect-btns {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .reflect-btns .btn {
    flex: 1 1 0;
    min-width: 140px;
    padding: 12px 14px;
    font-size: .95em;
    color: #fff;
    background: linear-gradient(135deg, #6b8fd4, #3d5a95);
  }
  .reflect-btns .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }

  .reflect-box {
    margin-top: 12px;
    background: #f4faff;
    border-left: 5px solid #7fc7ee;
    border-radius: 10px;
    padding: 14px 16px;
    color: #26485f;
    text-align: left;
    font-size: .96em;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .reflect-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .reflect-box .think-label {
    font-weight: 800;
    color: #0b5c8a;
    display: block;
    margin-bottom: 6px;
  }

  .footer { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .status {
    font-size: clamp(12px, 1.6vw, 14px);
    color: #9fd0ec;
    text-align: center;
    min-height: 1.5em;
    line-height: 1.55;
  }
  .footer .btn.primary {
    max-width: 320px; margin: 0 auto;
    font-size: 1em; padding: 12px 16px;
  }

  /* ---------- 結局卡 ---------- */
  #modal.ending { text-align: center; }
  .ending .badge {
    display: inline-block;
    font-size: .85em;
    letter-spacing: 3px;
    padding: 6px 18px;
    border-radius: 999px;
    background: #e2f0fb;
    color: #0b5c8a;
    margin-bottom: 12px;
  }
  .ending .end-emoji { font-size: 3em; line-height: 1; margin-bottom: 8px; }
  .ending h3 {
    border: none; padding: 0; margin: 0 0 10px;
    font-size: 1.7em; letter-spacing: 4px;
  }
  .ending .title-badge {
    display: inline-block;
    font-size: .82em;
    padding: 5px 14px;
    border-radius: 999px;
    background: #fff3c4;
    color: #8a6a00;
    border: 1px solid #f0d878;
    margin-bottom: 14px;
    letter-spacing: 1px;
    font-weight: 800;
  }
  .ending .end-comment {
    text-align: left;
    background: #f4faff;
    border-left: 5px solid #7fc7ee;
    border-radius: 10px;
    padding: 14px 16px;
    color: #26485f;
  }
  .ending .end-reflect {
    text-align: left;
    font-size: .95em;
    color: #5b7f96;
    margin-top: 12px;
  }
  .ending .end-stats {
    display: flex;
    justify-content: center;
    gap: 34px;
    margin: 16px 0 4px;
    font-size: 1em;
    color: #48697f;
  }
  .ending .end-stats b { font-size: 1.35em; }

  @media (max-width: 520px) {
    #overlay { padding: 10px; }
    #modal {
      max-height: calc(100dvh - 20px);
      padding: 20px 18px;
    }
    .reflect-btns .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<div class="game">

  <h1 class="title">🌊 觀海記 · 礁石與沙灘</h1>

  <!-- 數值條 -->
  <div class="hud">
    <div class="bar-row">
      <span class="label">原則值</span>
      <div class="bar"><div class="fill p" id="pFill"></div></div>
      <span class="val" id="pVal">50</span>
    </div>
    <div class="bar-row">
      <span class="label">關係值</span>
      <div class="bar"><div class="fill r" id="rFill"></div></div>
      <span class="val" id="rVal">50</span>
    </div>
  </div>

  <!-- 場景 -->
  <div class="scene" id="scene">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="rain"></div>
    <div class="sea"></div>
    <div class="sand"></div>
    <div class="path"></div>

    <div class="lighthouse">
      <div class="tower"></div>
      <div class="lamp"></div>
      <div class="roof"></div>
    </div>

    <div class="person" id="person">
      <div class="person-badge" id="personBadge"></div>
      <div class="person-inner">
        <div class="head"></div>
        <div class="body"></div>
        <div class="legs"><div class="leg"></div><div class="leg"></div></div>
      </div>
    </div>

    <!-- 漂浮數值層 -->
    <div class="float-layer" id="floatLayer"></div>
  </div>

  <!-- 底部控制 -->
  <div class="footer">
    <div class="status" id="status">點擊「開始旅程」，展開你的觀海之路。</div>
    <button class="btn primary" id="mainBtn">開始旅程</button>
  </div>

</div>

<!-- 對話遮罩 -->
<div id="overlay">
  <div id="modal">
    <div id="sceneView">
      <h3 id="modalTitle"></h3>
      <p id="modalDesc"></p>
      <div class="choices" id="choices">
        <button class="choice rock" id="btnRock"></button>
        <button class="choice sand" id="btnSand"></button>
        <button class="choice secret" id="btnSecret" style="display:none"></button>
      </div>
      <div id="resultBox" style="display:none">
        <p id="resultText"></p>
        <p class="delta" id="resultDelta"></p>
        <button class="btn primary" id="btnNext">繼續前進 →</button>
      </div>
    </div>
    <div id="endView" style="display:none"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== 情境資料 ==================== */
  const SCENARIOS = [
    {
      title: '第 1 塊礁石：考試被誤會作弊',
      desc: '段考時，隔壁同學的答案卡不小心滑到你的桌邊。老師走過來，懷疑你偷看，全班都在看你……',
      rock: { name: '據理力爭', result: '你當場向老師說明經過。老師查清後還你清白，但同學覺得你「太剛硬、不好相處」。', dp: 15, dr: -10 },
      sand: { name: '先接受處罰', result: '你默默接受扣分。事後老師發現是誤會並向你道歉，但你的成績已經受到影響。', dp: -5, dr: 15 }
    },
    {
      title: '第 2 塊礁石：好朋友借錢不還',
      desc: '好朋友跟你借了一筆錢，說好下週還，結果一拖再拖，好像忘了這件事。你們每天還是會一起打球、一起吃午餐……',
      rock: { name: '直接攤牌', result: '你把話講清楚，錢要回來了。但朋友的臉色變得很難看，你們之間出現了一道裂痕。', dp: 15, dr: -10 },
      sand: { name: '暫時不提', result: '你把話吞了回去。錢大概拿不回來了，但你們的友誼看起來還是和以前一樣。', dp: -5, dr: 15 }
    },
    {
      title: '第 3 塊礁石：被同學排擠',
      desc: '班上幾個同學開始刻意不找你講話，分組時也沒有人要跟你一組。你隱約知道，他們覺得你「跟大家不一樣」。',
      rock: { name: '不妥協，做自己', result: '你照自己的方式生活，不刻意討好任何人。日子孤獨，但心裡很自在。', dp: 15, dr: -10 },
      sand: { name: '主動示好', result: '你主動找他們聊天、配合他們的喜好。你融入了小圈圈，但心裡總有點違背自己的感覺。', dp: -5, dr: 15 }
    },
    {
      title: '第 4 塊礁石：父母偷看日記',
      desc: '你發現日記本被翻動過，位置和折角都跟你放的不一樣。媽媽說：「我們只是關心你。」',
      rock: { name: '嚴肅抗議', result: '你很認真地告訴他們這是你的隱私。父母很生氣，但從此之後，他們真的不敢再偷看了。', dp: 15, dr: -10 },
      sand: { name: '理解父母', result: '你選擇體諒他們的擔心，沒有多說什麼。父母很感動，但他們的操心似乎沒有減少。', dp: -5, dr: 15 },
      secret: { name: '好好談一談', result: '你告訴父母：我知道你們擔心我，但我也需要一點自己的空間。我們約好，如果我有心事，我會主動說；你們想關心我，可以先問我。父母點點頭，你們都鬆了一口氣。', dp: 10, dr: 10 }
    },
    {
      title: '第 5 塊礁石：分組報告被隊友拖累',
      desc: '分組報告的前一天晚上，你才發現隊友幾乎什麼都沒做。明天就要上台了，你的名字就寫在報告的第一頁。',
      rock: { name: '向老師舉報', result: '你把每個人的分工如實告訴老師。隊友被扣分，你也因此被班上一些人孤立。', dp: 15, dr: -10 },
      sand: { name: '自己多做一點', result: '你熬夜把整份報告補完。報告順利交出去了，但你累得幾乎說不出話。', dp: -5, dr: 15 },
      secret: { name: '和隊友一起想辦法', result: '你把隊友找來，說明目前的情況，一起討論怎麼分工。雖然時間很趕，但大家一起熬夜完成，每個人都盡了一份力。', dp: 10, dr: 10 }
    }
  ];

  /* 給小六學生看的白話反思引導 */
  const REFLECT = {
    rock: '堅持自己的想法很重要，但講話太大聲或太兇，可能會讓別人受傷。就像海裡的礁石，可以擋住大浪，也可以讓海水輕輕流過去。想一想：你能堅持自己的想法，但用比較溫柔的方式說出來嗎？',
    sand: '對朋友好、願意讓步，是很棒的事。但如果每次都退讓，久了可能會忘記自己真正想要什麼。就像沙灘很軟，但它也有自己的邊界。想一想：你可以和朋友好好相處，同時也保護自己嗎？'
  };

  /* ==================== 位置設定 ==================== */
  const START_X      = 5;
  const ROCK_X       = [20, 34, 48, 62, 76];
  const APPROACH_GAP = 5.5;
  const PASS_GAP     = 5.5;
  const END_X        = 86;

  /* ==================== 狀態 ==================== */
  const state = {
    p: 50,
    r: 50,
    idx: 0,
    busy: false,
    // 記錄玩家歷程，用於稱號
    history: [],           // 'rock' | 'sand' | 'secret'
    secretsAvailable: [],  // 每關是否有隱藏選項
    secretUsed: 0
  };

  /* ==================== DOM ==================== */
  const scene      = document.getElementById('scene');
  const personEl   = document.getElementById('person');
  const personBadge= document.getElementById('personBadge');
  const floatLayer = document.getElementById('floatLayer');
  const mainBtn    = document.getElementById('mainBtn');
  const statusEl   = document.getElementById('status');
  const overlay    = document.getElementById('overlay');
  const modal      = document.getElementById('modal');
  const sceneView  = document.getElementById('sceneView');
  const endView    = document.getElementById('endView');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc  = document.getElementById('modalDesc');
  const choicesEl  = document.getElementById('choices');
  const resultBox  = document.getElementById('resultBox');
  const resultText = document.getElementById('resultText');
  const resultDelta= document.getElementById('resultDelta');
  const btnRock    = document.getElementById('btnRock');
  const btnSand    = document.getElementById('btnSand');
  const btnSecret  = document.getElementById('btnSecret');
  const btnNext    = document.getElementById('btnNext');
  const pFill      = document.getElementById('pFill');
  const rFill      = document.getElementById('rFill');
  const pVal       = document.getElementById('pVal');
  const rVal       = document.getElementById('rVal');

  /* ==================== 建立礁石 ==================== */
  const rockEls = ROCK_X.map(function (x, i) {
    const el = document.createElement('div');
    el.className = 'rock';
    el.style.left = x + '%';
    el.innerHTML = '<span class="num">' + (i + 1) + '</span>';
    scene.appendChild(el);
    return el;
  });

  /* ==================== 工具函式 ==================== */
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function updateHUD() {
    pFill.style.width = state.p + '%';
    rFill.style.width = state.r + '%';
    pVal.textContent = state.p;
    rVal.textContent = state.r;
    updateWeather();
    updatePersonBadge();
  }

  /* 動態天氣：根據分數切換 scene 的 class */
  function updateWeather() {
    scene.classList.remove('mood-rock', 'mood-sand');
    const diff = state.p - state.r;
    if (diff > 20) {
      scene.classList.add('mood-rock');
    } else if (diff < -20) {
      scene.classList.add('mood-sand');
    }
  }

  /* 小人頭上的狀態圖示 */
  function updatePersonBadge() {
    if (!personEl.classList.contains('show')) {
      personBadge.classList.remove('show');
      return;
    }
    let icon = '';
    if (state.p >= 70 && state.r >= 70) icon = '🌟';
    else if (state.p >= 70) icon = '🛡️';
    else if (state.r >= 70) icon = '💖';
    else if (state.p < 40 && state.r < 40) icon = '💧';

    if (icon) {
      personBadge.textContent = icon;
      personBadge.classList.add('show');
    } else {
      personBadge.classList.remove('show');
    }
  }

  /* 漂浮數值 */
  function floatNumber(text, type) {
    const el = document.createElement('div');
    el.className = 'float-num ' + type;
    el.textContent = text;
    // 漂浮位置：在畫面中央偏上
    const x = 50 + (Math.random() * 20 - 10);
    el.style.left = x + '%';
    el.style.top  = '35%';
    floatLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 1700);
  }

  function spawnDelta(dp, dr) {
    let delay = 0;
    if (dp !== 0) {
      setTimeout(function () {
        floatNumber((dp > 0 ? '+' : '') + dp + ' 原則', dp > 0 ? 'up' : 'down');
      }, delay);
      delay += 200;
    }
    if (dr !== 0) {
      setTimeout(function () {
        floatNumber((dr > 0 ? '+' : '') + dr + ' 關係', dr > 0 ? 'up' : 'down');
      }, delay);
    }
  }

  function setStatus(t) { statusEl.textContent = t; }

  function highlightRock(i) {
    rockEls.forEach(function (el, k) {
      el.classList.toggle('active', k === i);
      el.classList.toggle('done', k < i);
    });
  }

  /* ==================== 流程 ==================== */
  function startGame() {
    mainBtn.disabled = true;
    personEl.classList.add('show');
    setStatus('旅程開始！沿著小路往前走，第一塊礁石就在前方。');
    mainBtn.textContent = '向前走';
    mainBtn.onclick = walkToRock;
    setTimeout(function () {
      mainBtn.disabled = false;
      updatePersonBadge();
    }, 350);
  }

  function walkToRock() {
    if (state.busy || state.idx >= SCENARIOS.length) return;
    state.busy = true;
    mainBtn.disabled = true;

    const i = state.idx;
    highlightRock(i);
    personEl.style.left = (ROCK_X[i] - APPROACH_GAP) + '%';
    setStatus('走向第 ' + (i + 1) + ' 塊礁石……');

    setTimeout(function () {
      state.busy = false;
      openDialog(i);
    }, 1000);
  }

  function openDialog(i) {
    const s = SCENARIOS[i];
    modal.classList.remove('ending');
    sceneView.style.display = 'block';
    endView.style.display = 'none';

    modalTitle.textContent = s.title;
    modalDesc.textContent = s.desc;
    choicesEl.style.display = 'flex';
    resultBox.style.display = 'none';
    btnSecret.style.display = 'none';

    btnRock.innerHTML = '🪨 礁石態度（堅持原則）<span class="sub">' + s.rock.name + '</span>';
    btnSand.innerHTML = '🏖 沙灘態度（包容退讓）<span class="sub">' + s.sand.name + '</span>';

    // 隱藏第三選項：第 4、5 關，且前 3 關原則與關係差距不超過 10
    let allowSecret = false;
    if (i >= 3 && s.secret) {
      const diff = Math.abs(state.p - state.r);
      if (diff <= 10) allowSecret = true;
    }
    if (allowSecret) {
      btnSecret.style.display = 'flex';
      btnSecret.innerHTML = '✨ 智慧態度（第三條路）<span class="sub">' + s.secret.name + '</span>';
      state.secretsAvailable[i] = true;
    } else {
      state.secretsAvailable[i] = false;
    }

    overlay.classList.add('show');
    modal.scrollTop = 0;
  }

  function choose(kind) {
    const s = SCENARIOS[state.idx];
    let opt;
    if (kind === 'rock')   opt = s.rock;
    if (kind === 'sand')   opt = s.sand;
    if (kind === 'secret') opt = s.secret;

    state.p = clamp(state.p + opt.dp, 0, 100);
    state.r = clamp(state.r + opt.dr, 0, 100);
    updateHUD();
    spawnDelta(opt.dp, opt.dr);

    state.history.push(kind);
    if (kind === 'secret') state.secretUsed += 1;

    choicesEl.style.display = 'none';
    resultBox.style.display = 'block';

    const label = (kind === 'rock') ? '礁石態度' : (kind === 'sand') ? '沙灘態度' : '智慧態度';
    resultText.textContent = '你選擇了「' + label + '：' + opt.name + '」。' + opt.result;

    const dpTxt = (opt.dp >= 0 ? '+' : '') + opt.dp;
    const drTxt = (opt.dr >= 0 ? '+' : '') + opt.dr;
    resultDelta.innerHTML =
      '原則值 <b class="' + (opt.dp >= 0 ? 'up' : 'down') + '">' + dpTxt + '</b>' +
      '　｜　關係值 <b class="' + (opt.dr >= 0 ? 'up' : 'down') + '">' + drTxt + '</b>';

    btnNext.textContent = (state.idx === SCENARIOS.length - 1)
      ? '繼續前進 → 燈塔'
      : '繼續前進 →';

    modal.scrollTop = 0;
  }

  function onNext() {
    overlay.classList.remove('show');
    const i = state.idx;
    rockEls[i].classList.remove('active');
    rockEls[i].classList.add('done');
    personEl.style.left = (ROCK_X[i] + PASS_GAP) + '%';
    state.idx += 1;
    state.busy = false;

    if (state.idx < SCENARIOS.length) {
      setStatus('越過了礁石。前方還有 ' + (SCENARIOS.length - state.idx) + ' 塊礁石。');
      mainBtn.textContent = '向前走';
      mainBtn.disabled = false;
      mainBtn.onclick = walkToRock;
    } else {
      setStatus('五塊礁石都走過了。燈塔就在前方。');
      mainBtn.textContent = '走向燈塔';
      mainBtn.disabled = false;
      mainBtn.onclick = walkToEnd;
    }
  }

  function walkToEnd() {
    if (state.busy) return;
    state.busy = true;
    mainBtn.disabled = true;
    personEl.style.left = END_X + '%';
    setStatus('沿著海岸，走向燈塔……');
    setTimeout(showEnding, 1500);
  }

  /* ==================== 稱號判定 ==================== */
  function getTitleBadge() {
    const h = state.history;
    const allRock = h.length === 5 && h.every(function (x) { return x === 'rock'; });
    const allSand = h.length === 5 && h.every(function (x) { return x === 'sand'; });
    if (state.secretUsed >= 3) return '🏅 觀海智者';
    if (allRock) return '🏅 鋼鐵礁石';
    if (allSand) return '🏅 終極沙灘';
    return '🏅 平凡旅人';
  }

  /* ==================== 結局 ==================== */
  function showEnding() {
    const diff = state.p - state.r;
    let title, emoji, color, comment, reflect;

    if (diff > 20) {
      title  = '孤獨的礁石';
      emoji  = '🪨';
      color  = '#6b5344';
      comment = '你像海中的礁石，風浪再大也不改變形狀。原則讓你看清自己，卻也讓身邊的人難以靠近。真正的堅持，不是拒絕所有海浪，而是知道哪些浪值得讓路。';
      reflect = '想一想：《觀海記》的結尾，作者站在岸邊，看著礁石與沙灘共存——如果這片海只剩下礁石，它還會好看嗎？';
    } else if (diff < -20) {
      title  = '被沖刷的沙灘';
      emoji  = '🏖';
      color  = '#c8891a';
      comment = '你像柔軟的沙灘，願意承接每一道浪。關係讓你被喜愛，卻也在一次次退讓中，慢慢失去了自己的形狀。學會說「不」，才能守住心裡的那道岸線。';
      reflect = '想一想：《觀海記》的結尾，作者說沙灘記住了每一道浪的形狀——可是潮水退去之後，沙灘還剩下什麼呢？';
    } else {
      title  = '智慧的觀海者';
      emoji  = '🌊';
      color  = '#0b7285';
      comment = '你既不做拒絕浪潮的礁石，也不做任人沖刷的沙灘。該堅持時挺立，該柔軟時退讓。就像《觀海記》的結尾——海不會只有一種樣子，懂得什麼時候當礁石、什麼時候當沙灘，才是最厲害的本事。';
      reflect = '想一想：《觀海記》的結尾，作者站在岸邊，看見礁石與沙灘共存。你的選擇，讓你看見了怎樣的自己？';
    }

    modal.classList.add('ending');
    sceneView.style.display = 'none';
    endView.style.display = 'block';

    endView.innerHTML =
      '<div class="badge">旅 程 結 束</div>' +
      '<div class="end-emoji">' + emoji + '</div>' +
      '<h3 style="color:' + color + '">' + title + '</h3>' +
      '<div class="title-badge">' + getTitleBadge() + '</div>' +
      '<p class="end-comment">' + comment + '</p>' +
      '<div class="end-stats">' +
        '<span>原則值 <b style="color:#d64545">' + state.p + '</b></span>' +
        '<span>關係值 <b style="color:#1864ab">' + state.r + '</b></span>' +
      '</div>' +
      '<p class="end-reflect">' + reflect + '</p>' +

      '<div class="reflect-btns">' +
        '<button class="btn" id="btnReflectRock">🛡️ 我想重新審視原則</button>' +
        '<button class="btn" id="btnReflectSand">💖 我想重新審視關係</button>' +
      '</div>' +
      '<div class="reflect-box" id="reflectBox">' +
        '<span class="think-label">💡 給你的思考</span>' +
        '<span id="reflectText"></span>' +
      '</div>' +

      '<button class="btn primary" id="btnRestart">重新開始旅程</button>';

    overlay.classList.add('show');
    modal.scrollTop = 0;
    setStatus('旅程結束。你是「' + title + '」。');

    // 綁定反思按鈕
    const reflectBox  = document.getElementById('reflectBox');
    const reflectText = document.getElementById('reflectText');

    document.getElementById('btnReflectRock').addEventListener('click', function () {
      reflectText.textContent = REFLECT.rock;
      reflectBox.classList.remove('show');
      // 觸發重新動畫
      void reflectBox.offsetWidth;
      reflectBox.classList.add('show');
    });
    document.getElementById('btnReflectSand').addEventListener('click', function () {
      reflectText.textContent = REFLECT.sand;
      reflectBox.classList.remove('show');
      void reflectBox.offsetWidth;
      reflectBox.classList.add('show');
    });

    document.getElementById('btnRestart').addEventListener('click', resetGame);
  }

  /* ==================== 重置 ==================== */
  function resetGame() {
    state.p = 50;
    state.r = 50;
    state.idx = 0;
    state.busy = false;
    state.history = [];
    state.secretsAvailable = [];
    state.secretUsed = 0;

    updateHUD();

    overlay.classList.remove('show');
    modal.classList.remove('ending');
    sceneView.style.display = 'block';
    endView.style.display = 'none';

    personEl.style.transition = 'none';
    personEl.style.left = START_X + '%';
    personEl.classList.remove('show');
    void personEl.offsetWidth;
    personEl.style.transition = '';

    rockEls.forEach(function (el) { el.classList.remove('active', 'done'); });

    setStatus('點擊「開始旅程」，展開你的觀海之路。');
    mainBtn.textContent = '開始旅程';
    mainBtn.disabled = false;
    mainBtn.onclick = startGame;
  }

  /* ==================== 綁定 ==================== */
  btnRock.addEventListener('click', function () { choose('rock'); });
  btnSand.addEventListener('click', function () { choose('sand'); });
  btnSecret.addEventListener('click', function () { choose('secret'); });
  btnNext.addEventListener('click', onNext);
  mainBtn.addEventListener('click', function () {
    if (mainBtn.onclick) mainBtn.onclick();
  });

  mainBtn.onclick = startGame;

  updateHUD();
})();
</script>
</body>
</html>
